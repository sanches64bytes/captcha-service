# Substitua os dois domínios pelos nomes reais antes de habilitar o arquivo.

upstream captcha_api {
    server unix:/run/captcha-api/gunicorn.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    client_max_body_size 2m;

    location /static/ {
        alias /opt/captcha-api/staticfiles/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
    location /api/ {
        proxy_pass http://captcha_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /health/ {
        proxy_pass http://captcha_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /admin/ { return 404; }
    location / { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name manage.example.com;
    client_max_body_size 2m;

    location /static/ {
        alias /opt/captcha-api/staticfiles/;
        expires 1d;
        add_header Cache-Control "private, no-store";
    }
    location /admin/ {
        proxy_pass http://captcha_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /health/ {
        proxy_pass http://captcha_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ { return 404; }
    location / { return 404; }
}
