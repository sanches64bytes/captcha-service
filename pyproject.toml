[project]
name = "api"
version = "0.1.0"
description = "API assíncrona para resolução autorizada de CAPTCHAs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "django>=6.0.8",
    "django-ninja>=1.6.2",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.0",
    "redis>=8.1.0",
    "whitenoise>=6.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]

[tool.ruff]
extend-exclude = ["**/migrations/*.py"]
