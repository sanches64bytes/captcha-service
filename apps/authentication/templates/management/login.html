<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · Gerenciamento</title>
<style>body{margin:0;background:#f7f9fc;color:#172033;font:15px system-ui,sans-serif}.box{width:min(390px,90%);margin:12vh auto;padding:30px;background:#fff;border:1px solid #e6eaf0;border-radius:10px}h1{margin-top:0}label{display:block;margin-top:16px;color:#667085}input{width:100%;padding:10px;margin-top:5px;border:1px solid #e6eaf0;border-radius:6px;box-sizing:border-box}button{width:100%;margin-top:22px;padding:10px;border:0;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer}.errorlist{color:#b42318;padding-left:18px}</style></head>
<body><div class="box"><h1>Entrar</h1><p>Acesse o painel de gerenciamento da Captcha API.</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}{{ form.username.label_tag }}{{ form.username }}{{ form.password.label_tag }}{{ form.password }}<button type="submit">Entrar</button></form></div></body></html>
